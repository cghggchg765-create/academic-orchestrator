name: workflow-contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install contract lint dependency
        run: python -m pip install pyyaml
      - name: Compile workflow tools
        run: python -m py_compile skills/mm-iteration-engine/scripts/*.py shared/state-engine/*.py scripts/*.py
      - name: Contract lint
        run: python scripts/lint_contracts.py
      - name: Command frontmatter tests
        run: python -m unittest scripts.test_check_command_frontmatter_name -v
      - name: Workflow tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  pytest-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runner deps
        run: python -m pip install pyyaml pytest
      - name: Pytest manifest drift guard
        run: python scripts/check_ci_pytest_manifest.py
      - name: Pytest manifest suites (157 + 20 orphan-wire)
        run: python scripts/run_ci_pytest_manifest.py
      - name: Writing-quality offline gate
        run: python scripts/evals/run_writing_quality.py
