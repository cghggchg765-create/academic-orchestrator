[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-orchestrator"
version = "2.0.0"
description = "可验证的数学建模多智能体协同与同步兼容工具"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "PyYAML>=6.0", "jsonschema>=4.0"]
humanizer = ["spacy>=3.7", "nltk>=3.8", "sentence-transformers>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
